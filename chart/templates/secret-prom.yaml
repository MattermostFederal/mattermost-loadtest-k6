{{- if and .Values.metrics.prometheusRemoteWrite.url (not .Values.metrics.prometheusRemoteWrite.existingSecret) -}}
{{- if and .Values.metrics.prometheusRemoteWrite.username .Values.metrics.prometheusRemoteWrite.bearerToken -}}
{{- fail "metrics.prometheusRemoteWrite: set EITHER username/password OR bearerToken, not both. k6's behavior with both set is undefined and most remote-write backends reject ambiguous auth." -}}
{{- end -}}
{{- if or .Values.metrics.prometheusRemoteWrite.username .Values.metrics.prometheusRemoteWrite.bearerToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mmlt.fullname" . }}-prom
  labels:
    {{- include "mmlt.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.metrics.prometheusRemoteWrite.username }}
  PROM_USERNAME: {{ .Values.metrics.prometheusRemoteWrite.username | quote }}
  PROM_PASSWORD: {{ .Values.metrics.prometheusRemoteWrite.password | quote }}
  {{- end }}
  {{- if .Values.metrics.prometheusRemoteWrite.bearerToken }}
  PROM_BEARER_TOKEN: {{ .Values.metrics.prometheusRemoteWrite.bearerToken | quote }}
  {{- end }}
{{- end -}}
{{- end -}}
