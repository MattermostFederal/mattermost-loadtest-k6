{{- if and .Values.bootstrap.enabled (not .Values.admin.existingSecret) -}}
{{- if or (not .Values.admin.email) (not .Values.admin.password) -}}
{{- fail "When bootstrap.enabled=true, set admin.email and admin.password (or admin.existingSecret)." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mmlt.fullname" . }}-admin
  labels:
    {{- include "mmlt.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
{{- end }}
