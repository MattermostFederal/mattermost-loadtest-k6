{{- $teardownActive := and (ne .Values.cleanup.teardownMode "none") .Values.bootstrap.enabled -}}
{{- $bothActive := and .Values.cleanup.posts $teardownActive -}}
{{- if or .Values.cleanup.posts $teardownActive -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mmlt.fullname" . }}-cleanup
  labels:
    {{- include "mmlt.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.cleanup.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "mmlt.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mmlt.serviceAccountName" . }}

      {{- /*
        Ordering: when both cleanup-posts AND teardown should run, cleanup
        goes in initContainers and teardown stays as the main container.
        Kubernetes guarantees initContainers complete successfully before
        the main container starts — replacing the old `sleep 5` race.

        With `restartPolicy: Never`, an initContainer failure fails the
        whole Pod, so teardown never runs when cleanup itself broke. That's
        intentional: if cleanup-posts can't even complete, hard-deleting
        users/channels would just orphan more state.
      */}}

      {{- if $bothActive }}
      initContainers:
        - name: cleanup-posts
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["k6", "run"]
          args:
            {{- if .Values.mattermost.insecureSkipTLSVerify }}
            - "--insecure-skip-tls-verify"
            {{- end }}
            - "/scripts/cleanup.js"
          env:
            {{- include "mmlt.cleanupEnv" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            {{- if not .Values.bootstrap.enabled }}
            - name: users
              mountPath: /users
              readOnly: true
            {{- end }}
      containers:
        - name: cleanup-teardown
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["k6", "run"]
          args:
            {{- if .Values.mattermost.insecureSkipTLSVerify }}
            - "--insecure-skip-tls-verify"
            {{- end }}
            - "/scripts/teardown.js"
          env:
            {{- include "mmlt.teardownEnv" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      {{- else if .Values.cleanup.posts }}
      containers:
        - name: cleanup-posts
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["k6", "run"]
          args:
            {{- if .Values.mattermost.insecureSkipTLSVerify }}
            - "--insecure-skip-tls-verify"
            {{- end }}
            - "/scripts/cleanup.js"
          env:
            {{- include "mmlt.cleanupEnv" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            {{- if not .Values.bootstrap.enabled }}
            - name: users
              mountPath: /users
              readOnly: true
            {{- end }}
      {{- else }}
      containers:
        - name: cleanup-teardown
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["k6", "run"]
          args:
            {{- if .Values.mattermost.insecureSkipTLSVerify }}
            - "--insecure-skip-tls-verify"
            {{- end }}
            - "/scripts/teardown.js"
          env:
            {{- include "mmlt.teardownEnv" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      {{- end }}

      volumes:
        - name: scripts
          configMap:
            name: {{ include "mmlt.fullname" . }}-scripts
            items:
{{- range $path, $_ := .Files.Glob "files/scripts/**.js" }}
              - key: {{ trimPrefix "files/scripts/" $path | replace "/" "__" }}
                path: {{ trimPrefix "files/scripts/" $path }}
{{- end }}
        {{- if and .Values.cleanup.posts (not .Values.bootstrap.enabled) }}
        - name: users
          secret:
            secretName: {{ include "mmlt.usersSecretName" . }}
        {{- end }}
{{- end }}
