apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mmlt.fullname" . }}
  labels:
    {{- include "mmlt.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  parallelism: {{ .Values.job.parallelism }}
  completions: {{ .Values.job.completions }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mmlt.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mmlt.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.bootstrap.enabled }}
      initContainers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["k6", "run"]
          args:
            {{- if .Values.mattermost.insecureSkipTLSVerify }}
            - "--insecure-skip-tls-verify"
            {{- end }}
            - "/scripts/bootstrap.js"
          env:
            - name: MM_URL
              value: {{ .Values.mattermost.url | quote }}
            - name: RUN_ID
              value: {{ .Release.Name | quote }}
            - name: BOOTSTRAP_NUM_USERS
              value: {{ .Values.bootstrap.numUsers | quote }}
            - name: BOOTSTRAP_NUM_CHANNELS
              value: {{ .Values.bootstrap.numChannels | quote }}
            - name: BOOTSTRAP_TEAM_DISPLAY_NAME
              value: {{ .Values.bootstrap.teamDisplayName | quote }}
            {{- include "mmlt.adminEnv" . | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      {{- end }}

      containers:
        - name: k6
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["k6", "run"]
          args:
            {{- if .Values.mattermost.insecureSkipTLSVerify }}
            - "--insecure-skip-tls-verify"
            {{- end }}
            {{- include "mmlt.metricsArgs" . | nindent 12 }}
            - "/scripts/{{ include "mmlt.scriptFile" . }}"
          env:
            - name: MM_URL
              value: {{ .Values.mattermost.url | quote }}
            - name: RUN_ID
              value: {{ .Release.Name | quote }}
            {{- if not .Values.bootstrap.enabled }}
            - name: USERS_FILE
              value: {{ include "mmlt.usersFilePath" . | quote }}
            {{- end }}
            {{- /* Per-script load overrides: stressors.<script>.{targetVUs,steadySec}
                  wins over the global load.* values when set. */}}
            {{- $cfgEarly := (index .Values.stressors .Values.script) | default dict }}
            - name: TARGET_VUS
              value: {{ ($cfgEarly.targetVUs | default .Values.load.targetVUs) | quote }}
            - name: RAMP_UP_SEC
              value: {{ .Values.load.rampUpSec | quote }}
            - name: STEADY_SEC
              value: {{ ($cfgEarly.steadySec | default .Values.load.steadySec) | quote }}
            - name: RAMP_DOWN_SEC
              value: {{ .Values.load.rampDownSec | quote }}
            - name: SESSION_SEC
              value: {{ .Values.load.sessionSec | quote }}
            {{- /* Per-script idle overrides: any stressors.<script-name>
                  block with minIdleMs/avgIdleMs wins over the default
                  load.* values. Falls back cleanly for scripts without
                  a stressor block. */}}
            {{- $cfg := (index .Values.stressors .Values.script) | default dict }}
            - name: MIN_IDLE_MS
              value: {{ ($cfg.minIdleMs | default .Values.load.minIdleMs) | quote }}
            - name: AVG_IDLE_MS
              value: {{ ($cfg.avgIdleMs | default .Values.load.avgIdleMs) | quote }}
            - name: PERCENT_REPLIES
              value: {{ .Values.load.percentReplies | quote }}
            - name: PERCENT_URGENT
              value: {{ .Values.load.percentUrgent | quote }}
            {{- if eq .Values.script "load-readonly" }}
            - name: READ_ONLY
              value: "true"
            {{- end }}
            {{- if .Values.load.ratesDistribution }}
            - name: RATES_DISTRIBUTION
              value: {{ .Values.load.ratesDistribution | quote }}
            {{- end }}
            {{- if .Values.bootstrap.enabled }}
            - name: BOOTSTRAP_NUM_USERS
              value: {{ .Values.bootstrap.numUsers | quote }}
            {{- end }}
            {{- if eq .Values.script "breakpoint" }}
            - name: BREAKPOINT_MAX_VUS
              value: {{ .Values.breakpoint.maxVUs | quote }}
            - name: BREAKPOINT_DURATION
              value: {{ .Values.breakpoint.duration | quote }}
            - name: BREAKPOINT_WRITE_P95_MS
              value: {{ .Values.breakpoint.writeP95Ms | quote }}
            - name: BREAKPOINT_DELAY_ABORT
              value: {{ .Values.breakpoint.delayAbortEval | quote }}
            {{- end }}
            {{- if eq .Values.script "load-search" }}
            - name: SEARCH_WEIGHT_MULTIPLIER
              value: {{ $cfg.weightMultiplier | quote }}
            {{- end }}
            {{- if eq .Values.script "load-attachments" }}
            - name: ATTACHMENT_SIZE_BYTES
              value: {{ $cfg.sizeBytes | quote }}
            - name: ATTACHMENT_WEIGHT
              value: {{ $cfg.weight | quote }}
            - name: ATTACHMENT_RANDOM_BYTES
              value: {{ $cfg.randomBytes | quote }}
            - name: ATTACHMENT_RANDOM_POOL_SIZE
              value: {{ $cfg.randomPoolSize | default 8 | quote }}
            - name: ATTACHMENT_SOFT_LIMIT_MB
              value: {{ $cfg.softLimitMB | default 500 | quote }}
            - name: ATTACHMENT_CONFIRM_LARGE
              value: {{ $cfg.confirmLarge | default false | quote }}
            {{- end }}
            {{- if eq .Values.script "load-realtime" }}
            - name: POST_WEIGHT_MULTIPLIER
              value: {{ $cfg.postWeightMultiplier | quote }}
            {{- end }}
            {{- /* Optional SLO overrides — propagate from values.metrics.slo
                  to the SLO_* env vars that lib/thresholds.js reads. */}}
            {{- range $k, $v := .Values.metrics.slo }}
            - name: {{ printf "SLO_%s" (snakecase $k | upper) }}
              value: {{ $v | quote }}
            {{- end }}
            {{- include "mmlt.metricsEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            {{- if not .Values.bootstrap.enabled }}
            - name: users
              mountPath: /users
              readOnly: true
            {{- end }}

      volumes:
        - name: scripts
          configMap:
            name: {{ include "mmlt.fullname" . }}-scripts
            items:
{{- range $path, $_ := .Files.Glob "files/scripts/**.js" }}
              - key: {{ trimPrefix "files/scripts/" $path | replace "/" "__" }}
                path: {{ trimPrefix "files/scripts/" $path }}
{{- end }}
        {{- if not .Values.bootstrap.enabled }}
        - name: users
          secret:
            secretName: {{ include "mmlt.usersSecretName" . }}
        {{- end }}
