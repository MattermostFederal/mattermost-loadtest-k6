{{- if and (not .Values.users.existingSecret) (not .Values.bootstrap.enabled) -}}
{{- if not .Values.users.file -}}
{{- fail "Either users.file (--set-file users.file=...) or users.existingSecret must be set, or enable bootstrap.enabled to generate users at install time." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mmlt.fullname" . }}-users
  labels:
    {{- include "mmlt.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "mmlt.usersSecretKey" . }}: |-
{{ .Values.users.file | indent 4 }}
{{- end }}
